# scripts/check.conf — zikirmatik (Flutter / Dart, Android). Bootstrap 2026-11-02; activated by
# spec 0001 (walking skeleton). Format: scripts/check.conf.example. Steps run in order, fail fast.
#
# --- Resource hygiene inventory (docs/testing.md, Resource hygiene) ---
# pub get        : leaves no process; writes the .dart_tool/ cache (does not change the next run).
# codegen        : gen-l10n and build_runner "build" are one-shot (no build daemon); .dart_tool/build/.
# format/analyze : the analysis server child exits with the command.
# test           : flutter_tester + frontend_server children exit with the command. Data: every test
#                  opens its own in-memory database or a temp dir it deletes (rule 5).
# apk            : Gradle daemon and Kotlin compile daemon would survive → disabled in
#                  android/gradle.properties and again via GRADLE_OPTS below. Slow (>1 min) → full only.
#
# --- Prerequisites ---
requires pub get: sh -c 'v=$(dart --version 2>&1 | sed -E "s/.*version: ([0-9]+)\.([0-9]+).*/\1 \2/"); set -- $v; [ "$1" -gt 3 ] || { [ "$1" -eq 3 ] && [ "$2" -ge 11 ]; }'
requires apk: sh -c '{ [ -n "${JAVA_HOME:-}" ] || flutter config --list 2>/dev/null | grep -q "jdk-dir: [^ ]"; } && { [ -n "${ANDROID_HOME:-}${ANDROID_SDK_ROOT:-}" ] || [ -d "${LOCALAPPDATA:-/nonexistent}/Android/Sdk" ]; }'
#
# --- Steps ---
pub get [fast]: flutter pub get --enforce-lockfile --suppress-analytics
codegen [fast]: sh tool/codegen_check.sh
format [fast]: sh tool/format_check.sh
analyze [fast]: flutter analyze --fatal-infos --fatal-warnings --suppress-analytics
test [fast]: env TZ=Europe/Istanbul flutter test --exclude-tags slow --suppress-analytics
# test slow: env TZ=Europe/Istanbul flutter test --tags slow --suppress-analytics
#   (stays off until the first test tagged slow exists: with no match dart test fails "No tests ran")
# resource hygiene: no Gradle daemon, no Kotlin daemon
apk: env GRADLE_OPTS="-Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process" flutter build apk --debug --suppress-analytics
