# scripts/check.conf — zikirmatik (Flutter / Dart, Android önce). Bootstrap 2026-11-02.
# Format: scripts/check.conf.example. Steps run in order, fail fast.
#
# GREENFIELD: bu adımlar kod gerektirir; kod ise spec ister (AGENTS.md kural 1). Bu yüzden hepsi
# yorum satırı. Walking skeleton spec'i (ilk spec) Flutter projesini oluşturur ve yorumları kaldırır;
# o spec'in BUILD'i residue testini her iki profilde çalıştırır.
#
# --- Resource hygiene envanteri (docs/testing.md, Resource hygiene) ---
# pub get        : süreç bırakmaz; .dart_tool/ önbelleği yazar (bir sonraki çalıştırmayı etkilemez).
# codegen        : build_runner "build" tek seferliktir (daemon yalnızca "build_runner daemon"da var);
#                  .dart_tool/build/ önbelleği yazar.
# format/analyze : analysis server alt süreci komutla birlikte biter.
# test           : flutter_tester + frontend_server alt süreçleri komutla biter; veri: her test kendi
#                  bellek içi drift veritabanını açar, diske bir şey yazmaz (kural 5).
# apk            : Gradle daemon'ı ve Kotlin compile daemon'ı KALIR → android/gradle.properties içinde
#                  org.gradle.daemon=false ve kotlin.compiler.execution.strategy=in-process
#                  (walking skeleton yazar); ayrıca GRADLE_OPTS ile zorlanır. Yavaş (>1 dk) → full-only.
#
# --- Prerequisites (walking skeleton'da etkinleşir; sürüm alt sınırı orada kesinleşir) ---
# requires pub get: sh -c 'v=$(dart --version 2>&1 | sed -E "s/.*version: ([0-9]+)\.([0-9]+).*/\1 \2/"); set -- $v; [ "$1" -gt 3 ] || { [ "$1" -eq 3 ] && [ "$2" -ge 11 ]; }'
# requires apk: sh -c '[ -n "$ANDROID_HOME$ANDROID_SDK_ROOT" ] || [ -d "$LOCALAPPDATA/Android/Sdk" ]'
#
# --- Planned steps ---
# pub get [fast]: flutter pub get --enforce-lockfile --suppress-analytics
# codegen [fast]: sh -c 'dart run build_runner build --delete-conflicting-outputs && test -z "$(git status --porcelain -- "lib/**/*.g.dart")"'
# format [fast]: dart format --output=none --set-exit-if-changed lib test
# analyze [fast]: flutter analyze --fatal-infos --fatal-warnings
# test [fast]: flutter test --exclude-tags slow --suppress-analytics
# test slow: flutter test --tags slow --suppress-analytics
#   (ilk slow test gelene kadar kapalı kalır: hiç test eşleşmezse dart test "No tests ran" ile kırmızı biter)
# resource hygiene: no Gradle daemon, no Kotlin daemon
# apk: env GRADLE_OPTS="-Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process" flutter build apk --debug --suppress-analytics
